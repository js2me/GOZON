allowBuilds:
  '@parcel/watcher': false
  esbuild: false
minimumReleaseAgeExclude:
  - mobx-view-model-devtools@0.1.5
  - mobx-view-model-react@11.0.0
  - mobx-view-model-vite-plugin@2.0.0
  - mobx-view-model@11.0.0
  - mobx-route@1.2.1
  - mobx-route@1.2.3
peerDependencyRules:
  allowedVersions:
    # Gozon uses mobx-route's router exports, not its optional ViewModel adapter.
    'mobx-route>mobx-view-model': '^11.0.0'
